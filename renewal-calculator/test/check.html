<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>Renewal calculator self-check</title>
<!--
  Headless self-check for ../index.html. Loads the page in a 375 px iframe, runs six cases,
  and writes one line per check into <pre id="out">. Read it without a human:

  msedge --headless=new --disable-gpu --virtual-time-budget=30000 --dump-dom \
    http://127.0.0.1:8778/mvp-variants/renewal-calculator/test/check.html

  Or add --screenshot=<png> --window-size=900,900 to see the 375 px frame.
  ?fault=1 replays the stale "3,645" number from 2026-10-22 07:35 so a demo can show one FAIL.
  ?hideframe=1 runs the same checks with the 375 px frame blurred and grey (for teaching recordings).
  ?fault=1&rerun=1 runs once with the fault, waits 4 s, then runs clean, on the same page.
-->
<style>
  body { margin: 0; font: 14px/1.5 ui-monospace, Consolas, monospace; background: #888; display: flex; gap: 12px; }
  iframe { width: 375px; height: 880px; border: 0; background: #fff; flex: none; }
  pre { margin: 0; padding: 8px; white-space: pre-wrap; background: #fff; flex: 1; min-width: 0; }
</style>
</head>
<body>
<iframe id="f" title="375 px"></iframe>
<pre id="out">RUNNING</pre>
<script>
'use strict';
const f = document.getElementById('f');
let FAULT = new URLSearchParams(location.search).get('fault') === '1';
// ?hideframe=1: keep running the page under test, but do not show it (teaching material must not show event branding)
// Blur, not hide: a hidden frame stops painting and the checks stall (seen 2026-10-22).
if (new URLSearchParams(location.search).get('hideframe') === '1') f.style.filter = 'blur(14px) grayscale(1) opacity(.45)';
const out = [];
let fails = 0;
const ok = (name, cond, detail) => {
  if (!cond) fails++;
  out.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' | ' + detail : ''}`);
  document.getElementById('out').textContent = `RUNNING ${out.length}\n` + out.join('\n');  // live progress
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const load = (q) => new Promise((r) => { f.onload = () => r(); f.src = '../' + q; });

async function settle(pred, ms = 8000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { if (pred()) return true; } catch (e) { /* not ready */ } await wait(100); }
  return false;
}

async function run() {
  const cases = [
    { name: 'own-price building', q: '?t=63000030&q=信義路2段86巷40號', expect: (d) => d.getElementById('status').textContent.includes('找到') && d.getElementById('calc-src').textContent.includes('這棟近 3 年') },
    { name: 'sea-sand flag', q: '?t=63000030&q=仁愛路三段96號', expect: (d) => d.querySelectorAll('.flag').length === 1 && !d.getElementById('cards').textContent.includes('結構安全補強') && d.getElementById('cards').textContent.includes('海砂屋') },
    // debug-6a's worked example (consent-simulator/decision-tree/alternatives.md §2.5): Wanhua 4F walk-up,
    // built 1978, wants to rebuild, site 300 m2, cannot merge, renewal area unknown, 60% willing,
    // elderly at home, cannot afford. Expect 15 options shown; 7599 and proactive assessment excluded.
    { name: 'decision tree worked example', q: '?t=63000070&q=寶興街65巷2號', after: async (d) => {
        const pick = (id, text) => {
          const lab = [...d.querySelectorAll(`input[name="q-${id}"]`)].map((i) => i.parentElement).find((l) => l.textContent.trim() === text);
          lab.querySelector('input').checked = true;
          lab.querySelector('input').dispatchEvent(new Event('change'));
        };
        pick('user_goal', '想重建');
        pick('consent_share_est', '過半');
        pick('can_afford_cost_share', '付不起');
        pick('can_merge_neighbors', '不是');
        d.getElementById('elderly').checked = true; d.getElementById('elderly').dispatchEvent(new Event('input'));
        d.getElementById('site').value = '300'; d.getElementById('site').dispatchEvent(new Event('input'));
      },
      expect: (d) => {
        const shown = d.querySelectorAll('#cards .nc').length;
        const off = d.getElementById('cards-out').textContent;
        return shown === 15 && off.includes('7599') && off.includes('主動輔導') && d.getElementById('cards').textContent.includes('增設電梯');
      },
      detail: (d) => `shown ${d.querySelectorAll('#cards .nc').length}; off: ${d.getElementById('cards-out').textContent}` },
    { name: 'quake flag', q: '?q=大安區信義路4段60號', expect: (d) => d.getElementById('flags').textContent.includes('黃單') },
    { name: 'similar addresses', q: '?t=63000030&q=信義路二段86巷', expect: (d) => d.querySelectorAll('#suggest button').length > 0 },
    { name: 'not found', q: '?t=63000030&q=火星路1號', expect: (d) => d.getElementById('status').classList.contains('err') && d.getElementById('h-now-val').textContent.includes('萬') },
    { name: 'no address', q: '', expect: (d) => d.getElementById('h-now-val').textContent.includes('萬') && d.getElementById('afford').textContent.includes('這個區'), detail: (d) => d.getElementById('afford').textContent },
  ];
  for (const c of cases) {
    await load(c.q);
    const d = () => f.contentDocument;
    const done = await settle(() => d().getElementById('verdict').textContent.length > 0 && (c.q === '' || d().getElementById('status').textContent.length > 0 && !d().getElementById('status').textContent.includes('讀取')));
    const doc = d();
    const w = f.contentWindow;
    ok(`${c.name}: loads`, done, doc.getElementById('verdict').textContent.trim());
    if (c.after) { await c.after(doc); await wait(300); }
    ok(`${c.name}: expected content`, c.expect(doc), c.detail ? c.detail(doc) : '');
    ok(`${c.name}: no JS errors`, (w.__errors || []).length === 0, (w.__errors || []).join('; '));
    ok(`${c.name}: no horizontal scroll at 375 px`, doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`);
    if (c.name === 'own-price building') {
      const fs = (sel) => parseFloat(w.getComputedStyle(doc.querySelector(sel)).fontSize);
      ok('body font >= 17px', fs('body') >= 17, fs('body') + 'px');
      ok('result numbers >= 32px', fs('.hero-nums b') >= 32 && fs('.verdict .big') >= 32, `${fs('.hero-nums b')}px / ${fs('.verdict .big')}px`);
      ok('burden default comes from debug-e3 cases', doc.getElementById('burden-src').textContent.includes('實測 debug-e3'), `${doc.getElementById('burden').value}%`);
      await wait(800);  // let Kit.count land
      // ?fault=1 (teaching demo): put back the stale number we really saw on 2026-10-22 07:35
      if (FAULT) doc.querySelector('#flow [data-card="now"] .num').textContent = '3,645';
      const heroDiff = doc.querySelector('.verdict .big').textContent.replace(/[^0-9－＋]/g, '');
      const flowDiff = doc.querySelector('#flow [data-card="diff"] .num').textContent.replace(/[^0-9－＋]/g, '');
      ok('formula flow: 6 cards, diff matches hero', doc.querySelectorAll('#flow .fc').length === 6 && heroDiff === flowDiff, `${heroDiff} / ${flowDiff}`);
      const heroNow = doc.getElementById('h-now-val').textContent.replace(/[^0-9]/g, '');
      const flowNow = doc.querySelector('#flow [data-card="now"] .num').textContent.replace(/[^0-9]/g, '');
      ok('formula flow: "now" card matches hero', heroNow === flowNow, `${heroNow} / ${flowNow}`);
      ok('relocation section: 2 bars, cost in flow', doc.querySelectorAll('#relo-bars .bar').length === 2 && doc.querySelector('#flow [data-card="relo"] .num').textContent !== '—', doc.querySelector('#flow [data-card="relo"] .eq').textContent);
      const badges = doc.querySelectorAll('.q-bar .q-badges span');
      ok('quest bar: 3 badges, "找到你家" on after the address match', badges.length === 3 && badges[0].classList.contains('on'), [...badges].map((x) => x.className || '-').join(','));
      const af = doc.getElementById('afford');
      ok('afford line: village income and years of self-pay', !af.hidden && af.textContent.includes('這個里') && af.textContent.includes('年所得') && af.textContent.includes('平均不是中位數'), af.textContent);
      const rp = doc.getElementById('relo-paid');
      rp.checked = true; rp.dispatchEvent(new Event('input'));
      ok('afford line: no self-pay when the implementer pays', !af.hidden && !af.textContent.includes('自備款'), af.textContent);
      rp.checked = false; rp.dispatchEvent(new Event('input'));
      ok('flip chart has two bars', doc.querySelectorAll('#flip .dv').length === 2, doc.getElementById('flip').textContent.replace(/\s+/g, ' ').trim());
      const h = doc.getElementById('house-new');
      ok('hero house animates (CSS transition)', w.getComputedStyle(h).transitionDuration !== '0s', w.getComputedStyle(h).transition);
      const t0 = h.style.transform;
      const b = doc.getElementById('bonus');
      b.value = 80; b.dispatchEvent(new Event('input'));
      ok('slider moves the hero', h.style.transform !== t0, `${t0} -> ${h.style.transform}`);
      b.value = 30; b.dispatchEvent(new Event('input'));
      // INFO: visible text by size (closed <details> excluded), like design-kit/audit.html
      const hid = (e) => { const x = e.closest('details:not([open])'); return x && !e.closest('summary'); };
      const by = {};
      let total = 0;
      doc.querySelectorAll('body *').forEach((e) => {
        if (!e.offsetParent || hid(e)) return;
        [...e.childNodes].forEach((n) => {
          if (n.nodeType !== 3 || !n.textContent.trim()) return;
          const px = Math.round(parseFloat(w.getComputedStyle(e).fontSize));
          const c = n.textContent.trim().length;
          total += c;
          (by[px] = by[px] || []).push(`${c}:${e.tagName.toLowerCase()}.${e.className || e.id}`);
        });
      });
      ok('no visible text under 15px', Object.keys(by).every((px) => Number(px) >= 15), Object.keys(by).join(','));
      out.push(`INFO visible chars ${total}; 15px parts: ${(by[15] || []).slice(0, 30).join(' ')}`);
    }
  }
  out.unshift(`${fails === 0 ? 'ALL PASS' : fails + ' FAIL'} (${new Date().toISOString()})${FAULT ? '  [fault=1：模擬 10/22 07:35 真的抓到的錯]' : ''}`);
  // failures first, so a person only reads the red lines
  const head = out.shift();
  out.sort((a, b) => (a.startsWith('FAIL') ? 0 : 1) - (b.startsWith('FAIL') ? 0 : 1));
  out.unshift(head);
  document.getElementById('out').textContent = out.join('\n');
}
// ?tall=1[&q=...]: no tests, just a 375 x 4200 frame for a full-page screenshot
// (msedge --headless=new --screenshot=<png> --window-size=800,4300 ".../test/check.html?tall=1").
const P = new URLSearchParams(location.search);
if (P.get('tall')) {
  f.style.height = '4200px';
  f.src = '../' + (P.get('q') ? '?' + P.get('q') : '?t=63000030&q=信義路2段86巷40號');
  document.getElementById('out').textContent = 'TALL';
} else {
  const go = async () => {
    await run();
    // ?rerun=1: after a fault run, wait 4 s and run again without the fault (one recording, no navigation)
    if (P.get('rerun') === '1' && FAULT) {
      await wait(4000);
      FAULT = false; fails = 0; out.length = 0;
      await run();
    }
  };
  go().catch((e) => { document.getElementById('out').textContent = 'ERROR ' + e; });
}
</script>
</body>
</html>
