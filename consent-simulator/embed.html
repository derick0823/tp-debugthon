<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住戶會怎麼說</title>
<!--
  Embeddable 320x200 carousel of AI resident quotes.
  Usage: <iframe src="../consent-simulator/embed.html" width="320" height="200" style="border:0"></iframe>
  Options: ?interval=3000 (ms), ?theme=light|dark
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1a1f22; --muted: #5b6670; --line: #d5dad6; --tag-bg: #efe7fb; --tag-fg: #4a2a7a; --accent: #1f5f8b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c2226; --fg: #e8ecee; --muted: #a3adb8; --line: #34404a; --tag-bg: #2c2340; --tag-fg: #d8c6f5; --accent: #6fb0e0; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1c2226; --fg: #e8ecee; --muted: #a3adb8; --line: #34404a; --tag-bg: #2c2340; --tag-fg: #d8c6f5; --accent: #6fb0e0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 17px/1.45 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  }
  .card { height: 100%; display: flex; flex-direction: column; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
  .tag { align-self: flex-start; background: var(--tag-bg); color: var(--tag-fg); border-radius: 999px; padding: 1px 10px; font-size: 15px; font-weight: 700; }
  .slide { flex: 1; display: flex; gap: 10px; align-items: center; transition: opacity .35s ease; }
  .slide.fade { opacity: 0; }
  .avatar { font-size: 44px; line-height: 1; flex: none; }
  .quote { font-size: 17px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .who { font-size: 15px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); }
  a { color: var(--accent); text-decoration: none; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
<link rel="stylesheet" href="../design-kit/theme-puma.css">
<style>
  html:root:not([data-theme="never"]) { --bg: #ffffff; --fg: var(--brand-ink); --muted: var(--brand-muted); --line: var(--brand-border);
    --tag-bg: #f3e4f1; --tag-fg: #6a3a6f; --accent: var(--brand-deep); color-scheme: light; }
  html:root:not([data-theme="never"]) body { background: var(--bg); color: var(--fg); }
  .card { border-radius: 22px; }
  .dots i.on { background: var(--brand-primary); }
</style>
</head>
<body>
<div class="card" id="card" aria-live="polite">
  <span class="tag">🤖 AI 扮演的虛構住戶</span>
  <div class="slide" id="slide"><span class="avatar" id="avatar">🏠</span><div><span class="quote" id="quote"></span><span class="who" id="who"></span></div></div>
  <div class="foot"><div class="dots" id="dots"></div><a href="index.html#people" target="_top">看更多 →</a></div>
</div>
<script src="data/portraits-data.js?v=10"></script>
<script>
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  if (['light', 'dark'].includes(qs.get('theme'))) document.documentElement.dataset.theme = qs.get('theme');
  const interval = Math.max(1500, parseInt(qs.get('interval'), 10) || 3000);
  const items = ((window.PORTRAITS || {}).items || []).filter((x) => !x.check && x.run === 1);

  const group = (t) => t.startsWith('一樓店家') ? '店家' : t === '租客' ? '租客'
    : (t.includes('出租') || t.includes('不同住')) ? '不住這裡的屋主' : '住在這裡的屋主';
  const avatar = (p) => p.tenure.startsWith('一樓店家') ? '🏪' : p.tenure === '租客' ? '🔑'
    : (p.age >= 75 ? '👵' : p.age >= 65 ? '🧓' : p.lives_here ? '🏠' : '💼');
  const who = (p) => `${group(p.tenure)}・${p.age} 歲・${p.town_name}`;

  // Short quotes only (they must fit four lines at 320 px), rotated across tenure groups.
  const pools = {};
  items.forEach((x) => {
    const q = [x.r.reaction_a.quote, x.r.reaction_b.quote].filter((s) => s && s.length <= 42).sort((a, b) => a.length - b.length)[0];
    if (!q) return;
    (pools[group(x.p.tenure)] = pools[group(x.p.tenure)] || []).push({ q, p: x.p });
  });
  const order = ['住在這裡的屋主', '店家', '租客', '不住這裡的屋主'];
  const slides = [];
  for (let i = 0; slides.length < 12 && i < 20; i++) {
    order.forEach((g) => { const a = pools[g] || []; if (a[i] && slides.length < 12) slides.push(a[i]); });
  }
  if (!slides.length) { document.getElementById('quote').textContent = '資料還沒產生。'; return; }

  const dots = document.getElementById('dots');
  slides.forEach(() => dots.appendChild(document.createElement('i')));
  let k = 0;
  const show = (i) => {
    const s = slides[i];
    document.getElementById('avatar').textContent = avatar(s.p);
    document.getElementById('quote').textContent = '「' + s.q + '」';
    document.getElementById('who').textContent = who(s.p);
    Array.from(dots.children).forEach((d, j) => d.classList.toggle('on', j === i));
  };
  show(0);  // first frame is complete without any animation
  const slide = document.getElementById('slide');
  let paused = false;
  document.getElementById('card').addEventListener('mouseenter', () => { paused = true; });
  document.getElementById('card').addEventListener('mouseleave', () => { paused = false; });
  setInterval(() => {
    if (paused || document.hidden) return;
    slide.classList.add('fade');
    setTimeout(() => { k = (k + 1) % slides.length; show(k); slide.classList.remove('fade'); }, 350);
  }, interval);
})();
</script>
</body>
</html>
