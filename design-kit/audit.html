<!doctype html><meta charset="utf-8"><title>Audit</title>
<body style="margin:0"><pre id="out">running</pre><iframe id="f" style="width:375px;height:800px;border:0"></iframe>
<script>
// Usage: audit.html?u=../renewal-calculator/  -> loads page at 375px, reports overflow and small text
const u=new URLSearchParams(location.search).get('u'),f=document.getElementById('f');
f.src=u;f.onload=()=>setTimeout(()=>{const d=f.contentDocument,w=f.contentWindow,r=[];
r.push('scrollWidth '+d.documentElement.scrollWidth+' / 375');
const wide=[...d.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>376&&e.offsetParent).slice(0,8).map(e=>e.tagName+'.'+e.className+'#'+e.id+' r='+Math.round(e.getBoundingClientRect().right));
r.push('wide: '+wide.join(' | '));
const sz={};let chars=0;const hid=e=>{const d=e.closest('details:not([open])');return d&&!e.closest('summary')};
d.querySelectorAll('body *').forEach(e=>{if((!e.offsetParent&&e.tagName!=='BODY')||hid(e))return;[...e.childNodes].forEach(n=>{if(n.nodeType===3&&n.textContent.trim()){const s=Math.round(parseFloat(w.getComputedStyle(e).fontSize)),c=n.textContent.trim().length;sz[s]=(sz[s]||0)+c;chars+=c;}})});
r.push('visible chars (closed details excluded) '+chars);r.push('chars by px: '+JSON.stringify(sz));
const small=[...d.querySelectorAll('body *')].filter(e=>e.offsetParent&&!hid(e)&&parseFloat(w.getComputedStyle(e).fontSize)<14&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim().length>8)).slice(0,6).map(e=>Math.round(parseFloat(w.getComputedStyle(e).fontSize))+'px '+e.textContent.trim().slice(0,30));
r.push('small samples:\n  '+small.join('\n  '));
document.getElementById('out').textContent=r.join('\n');},4000);
</script>
