<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>consent-tracker self-test</title>
<style>body{font:14px system-ui;margin:8px} iframe{width:375px;height:900px;border:1px solid #888} .PASS{color:green} .FAIL{color:red}</style></head>
<body>
<pre id="out">running</pre>
<iframe id="f"></iframe>
<script>
// Usage (headless): msedge --headless=new --virtual-time-budget=20000 --dump-dom <this page>
// Drives ../index.html in a same-origin iframe and prints one PASS/FAIL line per check.
// Clears the ct:* localStorage keys before and after, so it does not touch a real board in this browser profile.
const out = [], f = document.getElementById("f");
const ok = (name, cond, info = "") => { out.push(`${cond ? "PASS" : "FAIL"} ${name}${info ? " — " + info : ""}`); document.getElementById("out").textContent = ["running", ...out].join(String.fromCharCode(10)); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clearKeys = () => { try { Object.keys(localStorage).filter((k) => k.startsWith("ct:") || k === "mvp-quest-e").forEach((k) => localStorage.removeItem(k)); } catch (e) {} };
const open = (u) => new Promise((r) => { f.onload = () => setTimeout(r, 900); f.src = u; });

(async () => {
  clearKeys();
  await open("../index.html");
  let d = f.contentDocument, w = f.contentWindow, q = (s) => d.querySelector(s);
  ok("demo counts", q("#n-signed").textContent === "5" && q("#n-total").textContent === "10", `${q("#n-signed").textContent}/${q("#n-total").textContent}`);
  ok("self route short = 4", q("#n-short").textContent === "4", q("#n-short").textContent);
  ok("10 unit squares", d.querySelectorAll(".u").length === 10);
  ok("no horizontal scroll at 375", d.documentElement.scrollWidth <= d.documentElement.clientWidth, `${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`);
  ok("metro line has 8 stations", d.querySelectorAll(".stations li").length === 8);
  ok("current station U3 lit", d.querySelector(".stations li.now button").dataset.k === "U3" && d.querySelectorAll(".stations li.done").length === 2);
  ok("current agency shown", /誰負責：/.test(q("#line-now").textContent) && /rules-map\/#U3/.test(q("#line-now a").getAttribute("href")), q("#line-now").textContent);
  ok("demo opens 1F-1 timeline", q(".uid") && q(".uid").textContent === "1F-1" && d.querySelectorAll(".tl li").length === 6);
  ok("1F-1: 4 steps lit (no letter, deadline not yet)", d.querySelectorAll(".tl li.on").length === 4, `${d.querySelectorAll(".tl li.on").length} lit`);
  ok("deadline shows days left", /還有 22 天/.test(q(".tl").textContent));
  ok("law article cited", /§37 第 4 項/.test(q(".tl").textContent) && /§32/.test(q(".tl").textContent));
  ok("sim link", /consent-simulator\/index\.html\?n_total=10&n_signed=5&n_refused=1#sim$/.test(q("#btn-sim").getAttribute("href")), q("#btn-sim").getAttribute("href"));

  q('.u[data-id="5F-1"]').click(); await wait(200);
  ok("unit card opens", !q("#unit-card").hidden && q(".uid").textContent === "5F-1");
  q('#unit-card [data-st="s"]').click(); await wait(200);
  ok("signing lights the sign step", [...d.querySelectorAll(".tl li")][3].classList.contains("on"));
  ok("sign one -> 6 signed, short 3", q("#n-signed").textContent === "6" && q("#n-short").textContent === "3", `${q("#n-signed").textContent}, ${q("#n-short").textContent}`);
  const t = new Date(), local = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  ok("contacted date = local today", q('.tl input[data-f="contacted"]').value === local, q('.tl input[data-f="contacted"]').value);
  ok("saved to localStorage", JSON.parse(localStorage.getItem("ct:demo")).units.find((u) => u.id === "5F-1").st === "s");

  q('#routes [data-k="weilao"]').click(); await wait(200);
  ok("weilao blocked by 1 refusal", q("#n-short").textContent === "✗" && /過不了/.test(q("#next").textContent), q("#n-short-lab").textContent);
  q('#routes [data-k="urgent"]').click(); await wait(200);
  ok("urgent route passes (6 > 5)", q("#n-short").textContent === "✓");

  // CSV: capture the blob instead of downloading.
  let blob = null;
  w.URL.createObjectURL = (b) => { blob = b; return "blob:test"; };
  q("#btn-csv").click(); await wait(100);
  const csv = blob ? await blob.text() : "";
  ok("CSV has header + 10 rows", csv.trim().split(/\r\n/).length === 11, `${csv.trim().split(/\r\n/).length} lines`);
  ok("CSV has no name column", !/name|姓名|電話/.test(csv.split(/\r\n/)[0]), csv.split(/\r\n/)[0].replace("﻿", ""));

  // Share link -> read-only view.
  try { w.navigator.clipboard.writeText = () => Promise.resolve(); } catch (e) {}
  q("#btn-share").click(); await wait(100);
  const link = q("#share-out a").getAttribute("href");
  ok("share link has no dates", !/\d{4}-\d{2}-\d{2}/.test(link), link.split("#")[1]);
  await open("../index.html?view=shared#" + link.split("#")[1]);
  d = f.contentDocument; q = (s) => d.querySelector(s);
  ok("read-only banner", !q("#ro-banner").hidden);
  ok("read-only keeps counts", q("#n-signed").textContent === "6" && q("#n-total").textContent === "10");
  ok("read-only keeps station", d.querySelector(".stations li.now button").dataset.k === "U3");
  ok("read-only hides editing", q("#setup").hidden && q("#btn-csv").hidden);

  // Address lookup through debug-34's town file.
  await open("../index.html");
  d = f.contentDocument; w = f.contentWindow; q = (s) => d.querySelector(s);
  q("#setup").open = true;
  q("#town").value = "63000080"; q("#town").dispatchEvent(new Event("change"));
  for (let i = 0; i < 40 && !/棟/.test(q("#addr-msg").textContent); i++) await wait(250);
  ok("town file loads", /這一區有/.test(q("#addr-msg").textContent), q("#addr-msg").textContent);
  // Type a road name, then pick a suggestion with 6 or more doorplates.
  q("#addr").value = "木新路"; q("#addr").dispatchEvent(new Event("input")); await wait(200);
  const pick = [...d.querySelectorAll("#addr-list option")].find((o) => parseInt(o.textContent, 10) >= 6);
  ok("suggestions offered", !!pick, pick ? `${pick.value}（${pick.textContent}）` : "none");
  q("#addr").value = pick ? pick.value : ""; q("#addr").dispatchEvent(new Event("input")); await wait(200);
  const nIn = parseInt(q("#n-in").value, 10);
  ok("address fills household count", nIn > 0, `n=${q("#n-in").value}, f=${q("#f-in").value}`);
  q("#btn-make").click(); await wait(400);
  ok("new board from address", q("#n-total").textContent === String(nIn) && d.querySelectorAll(".u").length === nIn, `${q("#n-total").textContent} squares=${d.querySelectorAll(".u").length}`);
  ok("new board starts empty", q("#n-signed").textContent === "0");
  ok("page text has no undefined/NaN", !/undefined|NaN/.test(d.body.innerText));
  const n0 = d.querySelectorAll(".u").length;
  q("#btn-add").click(); await wait(300);
  ok("add one household", d.querySelectorAll(".u").length === n0 + 1 && q("#n-total").textContent === String(n0 + 1), `${n0} -> ${d.querySelectorAll(".u").length}`);

  // Quest bar (design-kit/quest.js) on a fresh demo board.
  clearKeys();
  await open("../index.html?q=1");
  d = f.contentDocument; q = (s) => d.querySelector(s);
  ok("quest bar with 4 steps", d.querySelectorAll(".q-bar .q-badges span").length === 4);
  q('#routes [data-k="urgent"]').click(); await wait(200);
  q('.u[data-id="5F-1"]').click(); await wait(200);
  q('#unit-card [data-st="s"]').click(); await wait(300);
  const badges = () => [...d.querySelectorAll(".q-bar .q-badges span")].map((b) => b.classList.contains("on") ? 1 : 0).join("");
  ok("status change + threshold badges", badges() === "0101", badges());
  ok("confetti on crossing the threshold", !!d.querySelector(".q-confetti"));
  q("#btn-add").click(); await wait(300);
  ok("add badge", badges() === "1101", badges());

  clearKeys();
  const fails = out.filter((x) => x.startsWith("FAIL")).length;
  out.unshift(`RESULT ${fails ? "FAIL" : "PASS"} ${out.length - fails}/${out.length} @ ${new Date().toISOString()}`);
  document.getElementById("out").textContent = out.join("\n");
})().catch((e) => { document.getElementById("out").textContent = "FAIL exception " + e; });
</script>
</body></html>
