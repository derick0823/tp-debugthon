<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我家健檢單（列印版）</title>
<link rel="stylesheet" href="print.css">
</head>
<body>
<!-- A4 print layout of the health report. Same URL params as index.html: ?addr=&age=&elder=1 (plus v=, t=, #w=). -->
<div class="toolbar no-print">
  <button type="button" id="btn-print" class="btn">列印／存 PDF</button>
</div>

<article class="sheet" id="sheet">
  <header class="head">
    <div class="head-title">
      <h1>我家健檢單</h1>
      <p class="head-sub">老屋與社區防災・住戶自我檢查用</p>
    </div>
    <dl class="head-meta" id="meta"></dl>
  </header>

  <p id="optline" class="optline" hidden></p>
  <p id="status" class="status" role="status">整理中⋯（第一次要讀全市門牌，約幾秒）</p>

  <div id="body" hidden>
    <section class="verdict" id="verdict"></section>

    <section class="sec" id="s-bldg">
      <h2><span class="no">一</span>老屋健檢：這一棟</h2>
      <div id="bldg"></div>
      <p id="nearby" class="nearby" hidden></p>
    </section>

    <section class="sec" id="s-vill">
      <h2><span class="no">二</span>我的里：五項級數與全市排名</h2>
      <div id="axes"></div>
      <div class="vill-grid">
        <div id="rank"></div>
        <div id="vmap"></div>
      </div>
      <div id="vbars"></div>
    </section>

    <section class="sec" id="s-check">
      <h2><span class="no">三</span>演練檢核表</h2>
      <p class="note" id="check-note" hidden></p>
      <ul class="check" id="check"></ul>
    </section>

    <section class="sec" id="s-act">
      <h2><span class="no">四</span>建議行動與補助</h2>
      <ol class="acts" id="acts"></ol>
    </section>

    <section class="sec foot" id="s-src">
      <h2><span class="no">五</span>資料來源與免責聲明</h2>
      <div class="footgrid">
        <div>
          <p class="disc" id="disc"></p>
          <ul class="src" id="src"></ul>
        </div>
        <div class="qrrow">
          <div id="qr" class="qr" aria-label="本頁網址 QR code"></div>
          <div class="qrtext"><b>掃描或輸入網址，看線上版：</b><br><span id="url" class="url"></span></div>
        </div>
      </div>
    </section>
  </div>
</article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script type="module" src="print.js"></script>
</body>
</html>
