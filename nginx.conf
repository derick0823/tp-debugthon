server {
    listen 8080;
    server_name _;

    # Disable absolute redirects and internal port appending (e.g. :8080)
    absolute_redirect off;
    port_in_redirect off;

    # 301 Permanent Redirect to GitHub Pages (preserves path and query parameters)
    return 301 https://derick0823.github.io/tp-debugthon$request_uri;
}
