server {
    listen 8080;
    server_name _;

    # Crucial for Cloud Run / reverse proxies:
    # Disable absolute redirects and internal port appending (e.g. :8080)
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Include default system MIME types (html, css, js, json, svg, images, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Additional custom MIME types
    types {
        application/geo+json geojson;
        application/octet-stream parquet;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/geo+json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Redirect root to MVP portal preserving query parameters
    location = / {
        return 302 /research/issue-06/mvp-variants/$is_args$args;
    }

    # Internal notes were removed for the public version: a missing .md shows a friendly notice instead of 404.
    location ~* \.md$ {
        try_files $uri /notice.html;
    }

    # Static file serving
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
