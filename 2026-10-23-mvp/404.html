<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>這一頁暫不公開｜模擬市民－都更人生</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff8f4; color: #211d1d;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  .card { max-width: 520px; margin: 24px 16px; padding: 32px 28px; background: #fff; border: 2px solid #efc5ad; border-radius: 22px;
    box-shadow: 0 8px 24px rgba(33,29,29,.08); text-align: center; }
  .icon { font-size: 52px; }
  h1 { font-size: 24px; margin: 12px 0 8px; }
  p { font-size: 18px; line-height: 1.6; color: #665b57; margin: 0 0 22px; }
  a { display: inline-block; padding: 12px 26px; border-radius: 999px; background: #db6a41; color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📒</div>
    <h1>這一頁是團隊的工作筆記</h1>
    <p>比賽版本先不公開這份內容。<br>回首頁，試試看你家的老屋健檢吧！</p>
    <a id="home" href="/research/issue-06/mvp-variants/">回到首頁</a>
  </div>
<script>
  // Cloud Run serves the site at "/", GitHub Pages under "/<repo>/": keep that prefix for the home link.
  var i = location.pathname.indexOf("/research/");
  var base = i >= 0 ? location.pathname.slice(0, i)
    : (/github\.io$/.test(location.hostname) ? "/" + location.pathname.split("/")[1] : "");
  document.getElementById("home").href = base + "/research/issue-06/mvp-variants/";
</script>
</body>
</html>
