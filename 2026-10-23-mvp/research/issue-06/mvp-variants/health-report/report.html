<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老屋健檢報告</title>
<link rel="stylesheet" href="report.css">
</head>
<body>
<!-- Version 4: formal, plain-language health report. Same URL params as index.html: ?addr=&age=&elder=1 (plus v=, t=, #w=).
     The resident's name is never read from the URL; it comes from the engine's `user` field (login) or a demo placeholder. -->
<div class="toolbar no-print">
  <button type="button" id="btn-print" class="btn">🖨️ 列印／存 PDF</button>
</div>

<!-- ~1 s "working" animation; skipped under prefers-reduced-motion -->
<div id="loader" class="loader no-print" role="status" aria-live="polite">
  <div class="loader-card">
    <p class="loader-title">正在產生你的健檢報告</p>
    <ol class="steps">
      <li data-step="1"><span class="tick" aria-hidden="true"></span>比對門牌</li>
      <li data-step="2"><span class="tick" aria-hidden="true"></span>查房子年紀</li>
      <li data-step="3"><span class="tick" aria-hidden="true"></span>算出風險</li>
    </ol>
  </div>
</div>

<article class="paper" id="paper">
  <header class="org">
    <div class="seal" aria-hidden="true">🏠</div>
    <div class="org-text">
      <p class="org-name">臺北市老屋健檢報告</p>
      <p class="org-sub">模擬市民－都更篇<span class="demo-tag">示範用・非官方文件</span></p>
    </div>
  </header>

  <dl class="meta" id="meta"></dl>

  <p id="status" class="status" hidden></p>

  <div id="body" hidden>
    <section class="verdict" id="verdict"></section>

    <section class="sec">
      <h2>你家的風險</h2>
      <div class="risks" id="risks"></div>
    </section>

    <section class="sec">
      <h2>你住的里</h2>
      <div id="village"></div>
    </section>

    <section class="sec">
      <h2>建議你這樣做</h2>
      <div class="acts" id="acts"></div>
      <div id="acts-more"></div>
    </section>

    <footer class="sec foot">
      <p class="disc" id="disc"></p>
      <details class="more"><summary>資料來源</summary><ul class="src" id="src"></ul></details>
      <div class="qrrow">
        <div id="qr" class="qr" aria-label="本頁網址 QR code"></div>
        <p class="qrtext">用手機掃描，看同一份報告的線上版</p>
      </div>
    </footer>
  </div>
</article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script type="module" src="report.js"></script>
</body>
</html>
