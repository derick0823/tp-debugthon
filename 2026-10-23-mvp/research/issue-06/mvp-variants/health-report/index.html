<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺北市老屋健檢報告</title>
<link rel="stylesheet" href="../../solutions/prototype/assets/vendor/leaflet.css">
<link rel="stylesheet" href="online.css">
</head>
<body>
<!-- Integrated online version. URL params: ?addr=&age=&elder=1 (plus v=, t=, #w=) and the optional
     profile type=&units=&floor=&ground=&own=&mc=&crack=. The resident's name never comes from the URL.
     The first version lives on as v1.html. -->
<main class="paper">
  <header class="org">
    <div class="seal" aria-hidden="true">🏠</div>
    <div class="org-text">
      <h1>臺北市老屋健檢報告</h1>
      <p class="org-sub">模擬市民－都更篇<span class="demo-tag">示範用・非官方文件</span></p>
    </div>
  </header>
  <dl class="meta" id="meta"></dl>
  <p id="status" class="status" role="status" hidden></p>

  <!-- cover: one picture + verdict + mini map -->
  <section class="cover">
    <figure class="house" aria-label="房子剖面圖，圓點是要注意的地方">
      <svg id="house" viewBox="0 0 600 540" role="img" aria-labelledby="house-t"><title id="house-t">房子剖面圖</title></svg>
      <div id="flags" class="flags" aria-label="列管旗標"></div>
      <div class="scan" aria-hidden="true"><i></i><span>健檢中⋯</span></div>
      <figcaption class="cap">圓點顏色：<i class="c-red"></i>要注意 <i class="c-amber"></i>留意 <i class="c-green"></i>還好 <i class="c-gray"></i>查不到。點圓點看是哪一項。</figcaption>
    </figure>
    <aside class="side">
      <div id="verdict" class="verdict"></div>
      <div class="ringbox">
        <div class="mapring"><div id="minimap" role="img" aria-label="你家到最近收容所的地圖"></div></div>
        <p id="shelter-line" class="sline"></p>
        <p class="osm">地圖 © OpenStreetMap</p>
      </div>
      <a id="btn-print" class="btn-print" href="print.html">🖨 印正式健檢單</a>
    </aside>
  </section>

  <section class="sec">
    <h2>你家的風險</h2>
    <div id="risks" class="risks"></div>
  </section>

  <section class="sec">
    <h2>接下來可以做的事</h2>
    <div id="acts" class="acts"></div>
    <div id="acts-more"></div>
  </section>

  <section class="sec" id="s-near">
    <h2>附近可以去哪裡</h2>
    <ul id="near" class="near"></ul>
  </section>

  <section class="sec">
    <details id="extra" class="extra">
      <summary><b>補充資料（選填）</b><span id="extra-hint">填了會讓報告更貼近你家</span></summary>
      <form id="form" autocomplete="off">
        <fieldset class="req"><legend>基本資料</legend>
          <label class="f-addr">門牌<input id="in-addr" name="addr" placeholder="例：大安區信義路2段86巷40號" enterkeyhint="done"></label>
          <label>屋齡（年）<input id="in-age" name="age" type="number" min="0" max="120" inputmode="numeric" placeholder="不知道可空白"></label>
          <div class="radios" role="radiogroup" aria-label="家裡有沒有 65 歲以上長者"><span class="lab">家裡有 65 歲以上長者</span>
            <label><input type="radio" name="elder" value="1"> 有</label><label><input type="radio" name="elder" value="0"> 沒有</label></div>
        </fieldset>
        <fieldset><legend>房子</legend>
          <label>房子類型<select name="type"><option value="">不填</option><option value="apt">公寓（5 樓以下，沒電梯）</option><option value="house">透天</option><option value="building">大樓</option></select></label>
          <label>整棟幾戶<input name="units" type="number" min="1" max="999" inputmode="numeric" placeholder="不填"></label>
          <label>你住幾樓<input name="floor" type="number" min="1" max="99" inputmode="numeric" placeholder="不填"></label>
          <label>一樓用途<select name="ground"><option value="">不填</option><option value="shop">店面</option><option value="parking">停車</option><option value="arcade">騎樓</option><option value="home">住家</option></select></label>
        </fieldset>
        <fieldset><legend>你和這棟</legend>
          <div class="radios" role="radiogroup" aria-label="自有或租屋"><span class="lab">房子是</span>
            <label><input type="radio" name="own" value="owner"> 自己的</label><label><input type="radio" name="own" value="renter"> 租的</label></div>
          <div class="radios" role="radiogroup" aria-label="有沒有管委會"><span class="lab">管委會</span>
            <label><input type="radio" name="mc" value="1"> 有</label><label><input type="radio" name="mc" value="0"> 沒有</label></div>
          <label class="chk"><input type="checkbox" name="crack" value="1"> 看到牆或柱子有裂縫、鋼筋露出來</label>
        </fieldset>
        <p class="fine">只用來產生這份報告，不會傳出這台電腦以外的地方。改了會馬上更新。</p>
      </form>
    </details>
  </section>

  <section class="sec">
    <h2>你住的里</h2>
    <div id="village"></div>
  </section>

  <footer class="sec foot">
    <p id="disc" class="disc"></p>
    <details><summary>資料來源</summary><ul id="src" class="src"></ul></details>
    <p class="fine">其他版本：<a href="v1.html" id="to-v1">第一版健檢單</a>、<a href="map.html" id="to-map">地圖版</a></p>
  </footer>
</main>

<script src="../../solutions/prototype/assets/vendor/leaflet.js"></script>
<script type="module" src="online.js"></script>
</body>
</html>
