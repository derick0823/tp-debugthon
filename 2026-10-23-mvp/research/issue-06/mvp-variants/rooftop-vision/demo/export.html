<!doctype html><meta charset="utf-8"><title>Export</title>
<!-- Dumps the "before" street SVG markup for video/src/ui/streetSvg.ts. Run with headless --dump-dom. -->
<body><iframe id="f" src="../index.html" style="width:900px;height:600px"></iframe><textarea id="o"></textarea>
<script>
f.onload = () => setTimeout(() => {
  try {
    const w = f.contentWindow;
    o.textContent = (w.sky() + w.bg() + '<g>' + w.beforeLayer() + '</g>' + w.trees())
      .replace(/<clipPath[\s\S]*?<\/clipPath>/, '').replace(/\s+/g, ' ');
  } catch (e) { o.textContent = 'ERR ' + e; }
}, 800);
</script>
