<html lang="zh-Hant">

<link rel="stylesheet" href="../design-kit/kit.css">
<style>
  .kicker{font-size:var(--fs-s);color:var(--muted);margin:0}
  h1{font-size:30px;line-height:1.25;margin:4px 0 6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
  .tabs button,.adds label{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 16px;min-height:44px;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s}
  .tabs button[aria-pressed=true]{background:var(--brand-deep,var(--accent));border-color:var(--brand-deep,var(--accent));color:#fff}
  figure{margin:0;position:relative;border-radius:16px;overflow:hidden;touch-action:pan-y;user-select:none;cursor:ew-resize;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  figure svg{display:block;width:100%;height:auto}
  .tag{position:absolute;top:10px;font-size:var(--fs-s);font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(20,25,30,.72);color:#fff;pointer-events:none}
  .tag.l{left:10px}.tag.r{right:10px;background:rgba(47,133,90,.9)}
  .handle{position:absolute;top:0;bottom:0;width:0;left:50%;pointer-events:none}
  .handle::before{content:"";position:absolute;top:0;bottom:0;left:-2px;width:4px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4)}
  .knob{position:absolute;top:50%;left:-24px;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:#fff;color:#1f2328;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:auto;outline-offset:3px}
  .note{font-size:var(--fs-s);color:var(--muted);margin:8px 0 0}
  .adds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .adds label{display:flex;align-items:center;gap:6px;border-radius:12px;padding:8px 10px}
  .adds input{width:22px;height:22px;accent-color:var(--green)}
  .adds label:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--panel))}
  .adds .ic{font-size:22px}
  .cards{display:grid;gap:12px}
  @media (min-width:720px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{cursor:pointer;border:2px solid var(--line);transition:border-color .2s,transform .2s}
  .card.on{border-color:var(--accent);transform:translateY(-2px)}
  .card .big{font-size:44px;line-height:1}
  .card h3{font-size:22px;margin:6px 0 4px}
  .card p{margin:0 0 10px}
  .pc{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
  .pc li{display:flex;align-items:center;gap:8px}
  .pc .i{font-size:24px;width:32px;text-align:center}
  .pc .y{color:var(--green);font-weight:900}.pc .n{color:var(--red);font-weight:900}
  .like{font:inherit;font-weight:800;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand-deep,var(--red));color:#fff;cursor:pointer;transition:transform .15s}
  .like:active{transform:scale(.96)}
  .like.pop{animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.08)}}
  .card .k-bar{margin-top:10px}
  .reset{font:inherit;font-size:var(--fs-s);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0}
  #addons g.addon{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s var(--ease)}
  #addons g.addon.show{opacity:1;transform:none}
</style>
<link rel="stylesheet" href="../design-kit/theme-puma.css">
</head>
<body class="k-page">
<main class="k-wrap">
  <p class="kicker">市政 debug 松・第 6 題・MVP 變體 F（願景示意）</p>
  <h1>都更後，屋頂可以長這樣</h1>
  <p class="k-lead">拖中間的把手。左邊是現在，右邊是都更後。</p>

  <div class="tabs" role="group" aria-label="選一種方案">
    <button data-s="green" aria-pressed="true">🌿 綠屋頂</button>
    <button data-s="solar" aria-pressed="false">☀️ 太陽能</button>
    <button data-s="facade" aria-pressed="false">🎨 統一色與立面</button>
  </div>

  <figure id="fig" aria-label="一個街廓的前後對照插圖">
    <svg id="art" viewBox="0 0 800 480" role="img" aria-hidden="true"></svg>
    <span class="tag l">現在</span><span class="tag r">都更後（示意）</span>
    <div class="handle" id="handle"><div class="knob" id="knob" tabindex="0" role="slider" aria-label="前後對照" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">⇆</div></div>
  </figure>
  <p class="note">示意圖，不是設計圖。樣子由住戶和建築師一起決定。</p>

  <h2 class="k-h2" style="margin-top:24px">我想加的</h2>
  <p>勾一個，圖上就會出現。</p>
  <div class="adds">
    <label><input type="checkbox" value="balcony"><span class="ic">🪴</span>陽台綠化</label>
    <label><input type="checkbox" value="lift"><span class="ic">♿</span>無障礙電梯</label>
    <label><input type="checkbox" value="garden"><span class="ic">🥬</span>社區菜園</label>
    <label><input type="checkbox" value="rain"><span class="ic">💧</span>雨水回收</label>
  </div>

  <h2 class="k-h2" style="margin-top:28px">你喜歡哪一種？</h2>
  <p>點卡片看圖，按愛心投一票。</p>
  <div class="cards" id="cards"></div>
  <button class="reset" id="reset">清除這台裝置的票數</button>

  <details class="k-more"><summary>這頁怎麼做的</summary>
    <div>
      <p>插圖是自己畫的示意，不是任何一棟真實建物。</p>
      <p>優缺點是一般常識的整理【推論】。補助、承重、法規都還沒查證【待確認】。</p>
      <p>票數只存在這台裝置。里民大會可以把平板傳著用，不會上傳。</p>
    </div>
  </details>
</main>
<script src="../design-kit/kit.js"></script>
<script src="../design-kit/quest.js"></script>
<script>
const W = 800, G = 410, DX = 46, DY = 30, FH = 34;
const B = [
  { x: 24, w: 132, f: 5 }, { x: 156, w: 118, f: 4 }, { x: 274, w: 146, f: 5 },
  { x: 420, w: 122, f: 4 }, { x: 542, w: 150, f: 5 }];
B.forEach(b => { b.top = G - b.f * FH - 8; });

const SCHEMES = {
  green: { icon: '🌿', name: '綠屋頂', say: '屋頂種草和小樹，變成大家的小公園。',
    pc: [['🌡️', '頂樓比較涼', 1], ['💧', '大雨時先吸住水', 1], ['🏗️', '要算承重，也要有人照顧', 0]] },
  solar: { icon: '☀️', name: '太陽能', say: '屋頂鋪滿板子，白天自己發電。',
    pc: [['⚡', '自己發電', 1], ['💰', '公共電費可以省一些', 1], ['🚫', '屋頂就不能當花園', 0]] },
  facade: { icon: '🎨', name: '統一色與立面', say: '拆掉鐵窗和加蓋，整排用同一套顏色。',
    pc: [['👀', '整條街變好看', 1], ['🧱', '鐵窗、雜物一次清掉', 1], ['🗳️', '全體住戶要先講好顏色', 0]] }
};

// ---------- tiny SVG helpers ----------
const P = pts => pts.map(p => p.join(',')).join(' ');
const poly = (pts, fill, ex = '') => `<polygon points="${P(pts)}" fill="${fill}" ${ex}/>`;
const rect = (x, y, w, h, fill, ex = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${ex}/>`;
// point on a roof: u along the front edge, t into the depth (0 front .. 1 back)
const rp = (b, u, t) => [b.x + u + t * DX, b.top - t * DY];
function box(x, y, w, h, dx, dy, front, top, side) {
  return poly([[x + w, y], [x + w + dx, y - dy], [x + w + dx, y + h - dy], [x + w, y + h]], side) +
    poly([[x, y], [x + w, y], [x + w + dx, y - dy], [x + dx, y - dy]], top) + rect(x, y, w, h, front);
}
function roofPara(b, u0, u1, t0, t1, fill, ex) {
  const a = rp(b, u0, t0), c = rp(b, u1, t0), d = rp(b, u1, t1), e = rp(b, u0, t1);
  return poly([a, c, d, e], fill, ex);
}
function windows(b, fn) {
  const n = Math.floor((b.w - 16) / 30), step = (b.w - 40) / (n - 1);
  let s = '';
  for (let k = 0; k < b.f - 1; k++) for (let j = 0; j < n; j++) s += fn(b.x + 12 + j * step, b.top + 12 + k * FH, k, j);
  return s;
}
const shade = (hex, f) => '#' + hex.slice(1).match(/../g).map(h => Math.max(0, Math.min(255, Math.round(parseInt(h, 16) * f))).toString(16).padStart(2, '0')).join('');

// ---------- scene parts ----------
function sky() {
  return `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient>
    <pattern id="tinR" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c0643b"/><rect width="3" height="8" fill="#a24f2c"/></pattern>
    <pattern id="tinB" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#5b86ad"/><rect width="3" height="8" fill="#456d92"/></pattern>
    <clipPath id="clipA"><rect id="clipR" x="400" y="0" width="800" height="480"/></clipPath>
  </defs>`;
}
function bg() {
  return `<rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="700" cy="70" r="34" fill="#ffd45c"/>
  <g fill="#fff" opacity=".9"><ellipse cx="140" cy="70" rx="46" ry="16"/><ellipse cx="172" cy="58" rx="30" ry="16"/><ellipse cx="470" cy="46" rx="40" ry="13"/></g>
  ${rect(0, G - 30, 800, 30, '#b9c3c9')}
  ${rect(0, G, 800, 18, '#d8d2c6')}${rect(0, G + 18, 800, 52, '#7d858c')}
  <line x1="0" y1="${G + 44}" x2="800" y2="${G + 44}" stroke="#f3f3f3" stroke-width="3" stroke-dasharray="24 18"/>`;
}
function trees() {
  return [70, 395, 735].map(x => `<rect x="${x - 3}" y="${G - 22}" width="6" height="30" fill="#7a5a3a"/><circle cx="${x}" cy="${G - 34}" r="20" fill="#4f9d5b"/><circle cx="${x - 10}" cy="${G - 26}" r="12" fill="#5fb06a"/>`).join('') +
    `<g transform="translate(250 ${G + 26})"><rect x="0" y="0" width="34" height="12" rx="6" fill="#e05a47"/><circle cx="6" cy="14" r="5" fill="#333"/><circle cx="28" cy="14" r="5" fill="#333"/><circle cx="18" cy="-8" r="6" fill="#ffd2a8"/></g>`;
}

const OLD = ['#cfc6b8', '#b8b0a2', '#d6ccba', '#aaa49a', '#c9bead'];
function beforeLayer() {
  let s = '';
  const extras = [{ tin: 'R', add: .8, tank: 0, ant: .8 }, { tin: 0, add: 0, tank: .3, ant: .7 }, { tin: 'B', add: .75, tank: .9, ant: .2 },
    { tin: 'R', add: .5, tank: 0, ant: .85, pole: 1 }, { tin: 'B', add: .85, tank: .1, ant: .6 }];
  B.forEach((b, i) => {
    const c = OLD[i], e = extras[i];
    s += box(b.x, b.top, b.w, G - b.top, DX, DY, c, shade(c, .82), shade(c, .68));
    // stains
    s += rect(b.x + 8, b.top + 4, 10, G - b.top - 40, shade(c, .9), 'opacity=".6"');
    s += windows(b, (x, y, k, j) => {
      let w = rect(x, y, 16, 18, '#5d6b78');
      if ((k + j + i) % 3) w += `<rect x="${x - 3}" y="${y - 3}" width="22" height="26" fill="none" stroke="#777" stroke-width="2"/>` +
        [4, 9, 14].map(d => `<line x1="${x - 3 + d}" y1="${y - 3}" x2="${x - 3 + d}" y2="${y + 23}" stroke="#777" stroke-width="1.5"/>`).join('');
      if ((k * 3 + j + i) % 5 === 0) w += rect(x + 18, y + 8, 12, 9, '#e9e9e4', 'stroke="#999"');
      return w;
    });
    // ground floor shutters
    s += rect(b.x + 6, G - 30, b.w - 12, 30, '#9a9a96') + Array.from({ length: 7 }, (_, k) => `<line x1="${b.x + 6}" y1="${G - 26 + k * 4}" x2="${b.x + b.w - 6}" y2="${G - 26 + k * 4}" stroke="#7d7d79"/>`).join('');
    // tin roof addition
    if (e.add) {
      const w = (b.w - 20) * e.add, [x0, y0] = rp(b, 6, .12), h = 26;
      s += box(x0, y0 - h, w, h, DX * .72, DY * .72, '#a5aaae', `url(#tin${e.tin})`, '#80868b');
      s += rect(x0 + 8, y0 - h + 8, 14, 12, '#5d6b78');
    }
    if (e.tank) { const [x, y] = rp(b, b.w * e.tank, .55); s += `<rect x="${x - 9}" y="${y - 50}" width="18" height="22" fill="#c9c9bf" stroke="#999"/><ellipse cx="${x}" cy="${y - 50}" rx="9" ry="3" fill="#e2e2da"/><line x1="${x - 6}" y1="${y - 28}" x2="${x - 6}" y2="${y}" stroke="#777" stroke-width="2"/><line x1="${x + 6}" y1="${y - 28}" x2="${x + 6}" y2="${y}" stroke="#777" stroke-width="2"/>`; }
    if (e.ant) { const [x, y] = rp(b, b.w * e.ant, .7); s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 52}" stroke="#555" stroke-width="2"/>` + [44, 36, 28].map((d, k) => `<line x1="${x - 9 + k * 2}" y1="${y - d}" x2="${x + 9 - k * 2}" y2="${y - d}" stroke="#555" stroke-width="2"/>`).join(''); }
    if (e.pole) { const [x, y] = rp(b, b.w * .15, .8); s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 26}" stroke="#666" stroke-width="2"/><line x1="${x + 40}" y1="${y}" x2="${x + 40}" y2="${y - 26}" stroke="#666" stroke-width="2"/><line x1="${x}" y1="${y - 24}" x2="${x + 40}" y2="${y - 24}" stroke="#666"/>` + rect(x + 6, y - 24, 8, 12, '#e66') + rect(x + 20, y - 24, 9, 14, '#6ae'); }
  });
  s += `<path d="M0 ${G - 150} Q 200 ${G - 120} 400 ${G - 160} T 800 ${G - 150}" fill="none" stroke="#333" stroke-width="1.5"/><path d="M0 ${G - 140} Q 260 ${G - 100} 520 ${G - 150} T 800 ${G - 136}" fill="none" stroke="#333" stroke-width="1.2"/>`;
  return s;
}

const CLEAN = ['#efe9de', '#e4ddd1', '#f1ebe0', '#e2dcd0', '#ece6da'];
const UNI = ['#f3e2c7', '#e7cba8', '#f3e2c7', '#e7cba8', '#f3e2c7'];
function afterLayer(sc) {
  let s = '';
  B.forEach((b, i) => {
    const c = sc === 'facade' ? UNI[i] : CLEAN[i];
    const roof = sc === 'green' ? '#8bcf73' : sc === 'solar' ? '#d9d6cf' : '#ddd3c3';
    s += box(b.x, b.top, b.w, G - b.top, DX, DY, c, roof, shade(c, .8));
    if (sc === 'facade') for (let k = 1; k < b.f; k++) s += rect(b.x, b.top + k * FH + 4, b.w, 3, '#c9825b');
    s += windows(b, (x, y, k) => rect(x - 1, y - 1, 18, 20, '#fff') + rect(x + 1, y + 1, 14, 16, '#a9d6f2') + rect(x + 1, y + 1, 5, 16, '#cdeafb') +
      (sc === 'facade' && k % 2 === 0 ? `<line x1="${x - 4}" y1="${y + 16}" x2="${x + 20}" y2="${y + 16}" stroke="#7a5640" stroke-width="2.5"/>` : ''));
    // shopfront
    const aw = sc === 'facade' ? '#c9825b' : ['#5aa0c8', '#e07a5f', '#81b29a', '#f2cc8f', '#5aa0c8'][i];
    s += rect(b.x + 6, G - 30, b.w - 12, 30, '#bfe3f5') + poly([[b.x + 4, G - 34], [b.x + b.w - 4, G - 34], [b.x + b.w - 10, G - 24], [b.x + 10, G - 24]], aw);
    if (sc === 'green') {
      for (let u = 10; u < b.w - 4; u += 18) { const [x, y] = rp(b, u, .18); s += `<circle cx="${x}" cy="${y - 4}" r="7" fill="#4fa35a"/>`; }
      s += roofPara(b, b.w * .42, b.w * .56, .3, .95, '#e3cf9f');
      const [tx, ty] = rp(b, b.w * .75, .6); s += `<rect x="${tx - 2}" y="${ty - 18}" width="4" height="18" fill="#7a5a3a"/><circle cx="${tx}" cy="${ty - 24}" r="13" fill="#3d8b4a"/>`;
    } else if (sc === 'solar') {
      for (let r = 0; r < 2; r++) for (let u = 8; u + 24 < b.w; u += 28) {
        s += roofPara(b, u, u + 24, .12 + r * .42, .48 + r * .42, '#28507c', 'stroke="#8fbde6" stroke-width="1"');
        const [x1, y1] = rp(b, u + 12, .12 + r * .42), [x2, y2] = rp(b, u + 12, .48 + r * .42);
        s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8fbde6" stroke-width=".8"/>`;
      }
    } else {
      const [a1, a2] = [rp(b, 0, 0), rp(b, b.w, 0)];
      s += `<line x1="${a1[0]}" y1="${a1[1] - 10}" x2="${a2[0]}" y2="${a2[1] - 10}" stroke="#7a5640" stroke-width="2.5"/>`;
      for (let u = 0; u <= b.w; u += 22) { const [x, y] = rp(b, u, 0); s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 10}" stroke="#7a5640" stroke-width="2"/>`; }
      const [px, py] = rp(b, b.w * .5, .6); s += `<rect x="${px - 20}" y="${py - 22}" width="40" height="4" fill="#c9825b"/><line x1="${px - 16}" y1="${py - 18}" x2="${px - 16}" y2="${py}" stroke="#7a5640" stroke-width="2"/><line x1="${px + 16}" y1="${py - 18}" x2="${px + 16}" y2="${py}" stroke="#7a5640" stroke-width="2"/>`;
    }
  });
  return s;
}
function addonLayer() {
  const g = (k, inner) => `<g class="addon" data-a="${k}">${inner}</g>`;
  let bal = '';
  B.forEach(b => { bal += windows(b, (x, y) => `<ellipse cx="${x + 8}" cy="${y + 21}" rx="11" ry="5" fill="#4fa35a"/><circle cx="${x + 2}" cy="${y + 18}" r="3" fill="#f28fb0"/>`); });
  const b2 = B[2], lx = b2.x + b2.w - 34;
  const lift = rect(lx, b2.top - 16, 24, G - b2.top + 16, '#9fd3f0', 'stroke="#fff" stroke-width="2" opacity=".92"') + rect(lx + 3, b2.top + 60, 18, 22, '#2b6cb0') +
    `<circle cx="${lx + 12}" cy="${G - 14}" r="11" fill="#2b6cb0"/><text x="${lx + 12}" y="${G - 9}" font-size="14" text-anchor="middle" fill="#fff">♿</text>`;
  const b3 = B[3];
  let gar = '';
  [[.08, .34], [.40, .66], [.72, .98]].forEach(([u0, u1]) => {
    gar += roofPara(b3, b3.w * u0, b3.w * u1, .2, .85, '#9b6b43');
    for (let t = .3; t < .85; t += .18) { const [x, y] = rp(b3, b3.w * (u0 + u1) / 2, t); gar += `<circle cx="${x - 6}" cy="${y - 3}" r="3.5" fill="#5cb85c"/><circle cx="${x + 6}" cy="${y - 3}" r="3.5" fill="#5cb85c"/>`; }
  });
  { const [x, y] = rp(b3, b3.w * .5, .5); gar += `<circle cx="${x}" cy="${y - 30}" r="5" fill="#ffd2a8"/><rect x="${x - 5}" y="${y - 25}" width="10" height="16" rx="4" fill="#e07a5f"/>`; }
  const b4 = B[4], rx = b4.x + b4.w;
  const rain = `<path d="M${rx - 4} ${b4.top} H${rx + 14} V${G - 40}" fill="none" stroke="#5f7f95" stroke-width="5"/><rect x="${rx + 2}" y="${G - 44}" width="30" height="40" rx="6" fill="#5aa7d6" stroke="#fff" stroke-width="2"/>` +
    `<path d="M${rx + 17} ${G - 34} q -6 9 0 12 q 6 -3 0 -12z" fill="#fff"/>`;
  return g('balcony', bal) + g('lift', lift) + g('garden', gar) + g('rain', rain);
}

// ---------- state + wiring ----------
const art = document.getElementById('art'), fig = document.getElementById('fig'), handle = document.getElementById('handle'), knob = document.getElementById('knob');
let scheme = 'green', pos = 50;
const adds = new Set();
function render() {
  fitView();
  art.innerHTML = sky() + bg() + `<g>${beforeLayer()}</g><g clip-path="url(#clipA)">${bg()}<g>${afterLayer(scheme)}</g><g id="addons">${addonLayer()}</g></g>` + trees();
  art.querySelectorAll('#addons .addon').forEach(g => g.classList.toggle('show', adds.has(g.dataset.a)));
  setPos(pos);
}
// narrow screens zoom into the middle of the block so the roofs stay readable
let VB = [0, 0, 800, 480];
function fitView() {
  VB = fig.clientWidth < 560 ? [120, 170, 540, 300] : [0, 0, 800, 480];
  art.setAttribute('viewBox', VB.join(' '));
}
function setPos(p) {
  pos = Math.max(0, Math.min(100, p));
  art.querySelector('#clipR').setAttribute('x', VB[0] + pos / 100 * VB[2]);
  handle.style.left = pos + '%';
  knob.setAttribute('aria-valuenow', Math.round(pos));
}
function fromEvent(e) { const r = fig.getBoundingClientRect(); setPos((e.clientX - r.left) / r.width * 100); }
let drag = false;
fig.addEventListener('pointerdown', e => { drag = true; Quest.done('看前後'); try { fig.setPointerCapture(e.pointerId); } catch (err) {} fromEvent(e); });
fig.addEventListener('pointermove', e => { if (drag) fromEvent(e); });
fig.addEventListener('pointerup', () => { drag = false; });
knob.addEventListener('keydown', e => { Quest.done('看前後'); if (e.key === 'ArrowLeft') setPos(pos - 5); if (e.key === 'ArrowRight') setPos(pos + 5); });

function setScheme(s) {
  scheme = s;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', c.dataset.s === s));
  render();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { setScheme(b.dataset.s); Quest.done('挑方案'); }));

// show more of the "after" side when something is picked, so the change is visible
function revealAfter() {
  if (pos <= 35) return;
  const from = pos, t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 500); setPos(from + (25 - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
document.querySelectorAll('.adds input').forEach(cb => cb.addEventListener('change', () => {
  cb.checked ? adds.add(cb.value) : adds.delete(cb.value);
  art.querySelectorAll('#addons .addon').forEach(g => g.classList.toggle('show', adds.has(g.dataset.a)));
  if (cb.checked) { revealAfter(); Quest.done('加一個'); }
}));

// likes: per-device counts, safe when storage is blocked
const KEY = 'rooftop-vision-likes';
let likes = { green: 0, solar: 0, facade: 0 };
try { Object.assign(likes, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(likes)); } catch (e) {} };
const cards = document.getElementById('cards');
cards.innerHTML = Object.entries(SCHEMES).map(([k, s]) => `
  <article class="k-card card" data-s="${k}">
    <div class="big" aria-hidden="true">${s.icon}</div>
    <h3>${s.name}</h3><p>${s.say}</p>
    <ul class="pc">${s.pc.map(([i, t, ok]) => `<li><span class="i" aria-hidden="true">${i}</span><span class="${ok ? 'y' : 'n'}">${ok ? '✓' : '✗'}</span>${t}</li>`).join('')}</ul>
    <button class="like" data-s="${k}">❤ 我喜歡這個</button>
    <div class="k-bar" style="--k-c:var(--red)"><i></i><b></b></div>
  </article>`).join('');
function drawLikes() {
  const max = Math.max(1, ...Object.values(likes));
  cards.querySelectorAll('.card').forEach(c => Kit.bar(c.querySelector('.k-bar'), likes[c.dataset.s], max, likes[c.dataset.s] + ' 票'));
}
cards.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const btn = e.target.closest('.like');
  if (btn) { Quest.done('投一票'); likes[btn.dataset.s]++; save(); drawLikes(); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  if (card.dataset.s !== scheme) { setScheme(card.dataset.s); Quest.done('挑方案'); }
});
document.getElementById('reset').addEventListener('click', () => { likes = { green: 0, solar: 0, facade: 0 }; save(); drawLikes(); });

// scripted drag for demo recordings: Rooftop.sweep(85, 20, 1800)
window.Rooftop = {
  setPos,
  sweep(a, b, ms = 1500) {
    Quest.done('看前後');
    const t0 = performance.now();
    const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); setPos(a + (b - a) * (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2)); if (k < 1) requestAnimationFrame(step); };
    step();
  }
};

Quest.init({ page: 'f', role: '設計師', steps: ['看前後', '挑方案', '加一個', '投一票'] });

// optional deep link for demos and screenshots: #s=solar&a=lift,rain&p=20
const q = new URLSearchParams(location.hash.slice(1));
(q.get('a') || '').split(',').filter(Boolean).forEach(a => { adds.add(a); const cb = document.querySelector(`.adds input[value="${a}"]`); if (cb) cb.checked = true; });
if (q.has('p')) pos = +q.get('p');
addEventListener('resize', () => { fitView(); setPos(pos); });
setScheme(SCHEMES[q.get('s')] ? q.get('s') : 'green');
drawLikes();
</script>
</body>
</html>
