<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>容積獎勵翻譯機</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../design-kit/theme-puma.css">
<style>
/* Map this page's own tokens onto the shared warm theme (theme-puma.css only renames the kit tokens). */
html:root:not([data-theme="never"]) {
  --text: var(--brand-ink); --card: #ffffff; --accent: var(--brand-deep); --ok: #2e7d4f; --warn: var(--brand-warning);
  --base: #b9aaa1; --base-win: #f6ebe4;
  --lv1: #f3e3d8; --lv2: var(--brand-yellow); --lv3: var(--brand-peach); --lv4: var(--brand-orange); --lv5: var(--brand-warning);
}
html:root:not([data-theme="never"]) .tile.l1 { color: var(--brand-ink); }
html:root:not([data-theme="never"]) .tabs button[aria-selected="true"] { color: var(--brand-deep); }
html:root:not([data-theme="never"]) .nums .up b { color: var(--brand-deep); }  /* orange text on white is below 3:1 */
</style>
</head>
<body>
<header class="top">
  <h1>都更看得懂</h1>
  <p class="lead">大樓多出來的樓地板，是怎麼一塊一塊拿到的。</p>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-bonus" aria-controls="panel-bonus" aria-selected="true">🏗 獎勵積木</button>
    <button role="tab" id="tab-village" aria-controls="panel-village" aria-selected="false">🏘 我的里</button>
  </nav>
</header>

<main>
  <!-- Tab 1: bonus blocks -->
  <section id="panel-bonus" role="tabpanel" aria-labelledby="tab-bonus">
    <div class="pick">
      <select id="case-select" aria-label="選一個都更案"></select>
    </div>
    <div class="tower-wrap">
      <figure class="tower-fig">
        <svg id="tower" viewBox="0 0 440 460" role="img" aria-label="容積獎勵積木圖"></svg>
        <figcaption class="hint">點一塊積木，看它是什麼。</figcaption>
      </figure>
      <div id="block-info" class="info" aria-live="polite"></div>
    </div>
    <div id="hero" class="nums"></div>
    <section id="usage" class="usage" hidden>
      <h2 id="usage-title">全臺北的都更案，最常拿哪幾塊</h2>
      <div id="usage-bars" class="ubars"></div>
      <details><summary>怎麼算的</summary><p id="usage-method" class="meta"></p></details>
    </section>
    <div id="skipped" class="skipped"></div>
    <details class="more">
      <summary>📋 本案資料與來源</summary>
      <div id="case-meta"></div>
    </details>
    <details class="more">
      <summary>✍ 自己貼數字</summary>
      <p class="hint">單位是平方公尺。空白當 0。</p>
      <div id="paste-form" class="paste-grid"></div>
      <button id="paste-apply" type="button">畫出來</button>
    </details>
    <details class="more">
      <summary>📖 名詞</summary>
      <dl class="terms">
        <dt>容積</dt><dd>能蓋的總樓地板面積。</dd>
        <dt>法定容積（F0）</dt><dd>沒有任何獎勵時能蓋的量，是積木的底座。</dd>
        <dt>ΔF</dt><dd>獎勵容積，也就是疊上去的積木。</dd>
        <dt>容積移轉</dt><dd>從別塊地買來的容積。它不是獎勵，所以不畫成積木。</dd>
      </dl>
    </details>
  </section>

  <!-- Tab 2: citizen village brief -->
  <section id="panel-village" role="tabpanel" aria-labelledby="tab-village" hidden>
    <div class="pick">
      <select id="town-select" aria-label="區"></select>
      <select id="village-select" aria-label="里"></select>
    </div>
    <div id="village-out"></div>
  </section>
</main>

<footer>
  <p>這是推估與白話整理，不是官方評估或核定。</p>
  <p class="build">設計原型 · 市政 debug 松第 6 題 · MVP 變體 B</p>
</footer>
<script src="../design-kit/quest.js"></script>
<script src="app.js"></script>
</body>
</html>
