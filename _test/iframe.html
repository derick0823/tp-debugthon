<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>375 px test frame</title>
<style>body{margin:0;background:#888;display:flex;gap:16px;padding:16px;font:14px system-ui;color:#fff}
iframe{border:0;background:#fff;width:375px;height:1500px}</style></head>
<body>
<div><div id="l"></div><iframe id="f"></iframe></div>
<script>
// Usage: /mvp-variants/_test/iframe.html?u=/mvp-variants/<folder>/   (headless Edge has a ~500 px minimum window width,
// so a 375 px window does not give a 375 px viewport; this frame does.)
const u = new URLSearchParams(location.search).get("u") || "/mvp-variants/rescue-drill-map/";
document.getElementById("l").textContent = "375 × 1500: " + u;
document.getElementById("f").src = u;
</script></body></html>
